name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Stage 1 — quality gate: lint, tests, frontend build
  # ------------------------------------------------------------------
  test:
    name: Test (pytest + frontend build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Run pytest (fails the pipeline on any test failure)
        working-directory: backend
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # Terraform syntax check (no AWS credentials needed)
  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: init and validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

  # Helm chart syntax check (no cluster needed)
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: lint and render templates
        run: |
          helm lint helm/clinicq
          helm lint helm/clinicq -f helm/clinicq/values-dev.yaml
          helm template clinicq helm/clinicq -f helm/clinicq/values-dev.yaml > /dev/null

  # ------------------------------------------------------------------
  # Stage 2 — build image, scan with Trivy, push only if the scan passes
  # ------------------------------------------------------------------
  build-scan-push:
    name: Build, scan and push (${{ matrix.component }})
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/clinicq-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (tag = commit SHA, not latest)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # Runs the official Trivy image directly (pinned version) instead of a third-party
      # action, so the pipeline does not depend on that action's tags.
      - name: Trivy scan (fails on HIGH / CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            "${IMAGE}:${GITHUB_SHA}"

      - name: Push image to GHCR
        run: docker push "${IMAGE}:${GITHUB_SHA}"

  # ------------------------------------------------------------------
  # Stage 3 — deploy to EKS with Helm (skipped unless DEPLOY_ENABLED=true)
  #
  # Repository Variables:  DEPLOY_ENABLED=true, EKS_CLUSTER_NAME, AWS_REGION,
  #                        SERVICE_MONITOR_ENABLED (optional, "true" once Prometheus is installed)
  # Repository Secrets:    AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  # The job installs ingress-nginx and metrics-server if they are missing, then deploys
  # the images that were just built (tag = this commit's SHA).
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to EKS with Helm
    needs: build-scan-push
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-eks
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'clinicq-eks' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment configuration
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          [ -n "$AWS_KEY" ]    || { echo "::error::Secret AWS_ACCESS_KEY_ID is not set"; missing=1; }
          [ -n "$AWS_SECRET" ] || { echo "::error::Secret AWS_SECRET_ACCESS_KEY is not set"; missing=1; }
          exit $missing

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          kubectl get nodes

      - name: Ensure ingress-nginx and metrics-server are installed
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx --create-namespace --wait --timeout 10m
          helm upgrade --install metrics-server metrics-server/metrics-server \
            --namespace kube-system --wait --timeout 5m

      - name: helm upgrade --install clinicq
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm upgrade --install clinicq ./helm/clinicq \
            --namespace clinicq --create-namespace \
            --set backend.image.repository="ghcr.io/${OWNER}/clinicq-backend" \
            --set backend.image.tag="${GITHUB_SHA}" \
            --set frontend.image.repository="ghcr.io/${OWNER}/clinicq-frontend" \
            --set frontend.image.tag="${GITHUB_SHA}" \
            --set serviceMonitor.enabled=${{ vars.SERVICE_MONITOR_ENABLED || 'false' }} \
            --atomic --wait --timeout 10m

      - name: Show deployment status
        run: |
          kubectl get pods,svc,ingress,hpa -n clinicq
          helm list -n clinicq
          echo "Application address (may take a few minutes to start resolving):"
          kubectl get svc ingress-nginx-controller -n ingress-nginx \
            -o jsonpath='http://{.status.loadBalancer.ingress[0].hostname}{"\n"}'