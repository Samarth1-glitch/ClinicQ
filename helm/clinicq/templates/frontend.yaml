apiVersion: v1
kind: Service
metadata:
  name: {{ include "clinicq.name" . }}-frontend
  labels:
    {{- include "clinicq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "clinicq.frontendSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clinicq.name" . }}-frontend
  labels:
    {{- include "clinicq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "clinicq.frontendSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clinicq.frontendSelector" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Nginx proxies /api/* here, so the app also works without the Ingress
            - name: BACKEND_URL
              value: http://{{ include "clinicq.name" . }}-backend:{{ .Values.backend.service.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
