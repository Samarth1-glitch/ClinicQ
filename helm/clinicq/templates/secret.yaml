apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clinicq.name" . }}-db
  labels:
    {{- include "clinicq.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgres.username .Values.postgres.password (include "clinicq.name" .) .Values.postgres.database | quote }}
