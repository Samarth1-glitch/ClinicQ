# Default values. CI overrides the image repositories and tags (tag = git commit SHA).
# Replace OWNER with your lowercase GitHub username/org.

imagePullSecrets: []   # not needed if you make the GHCR packages public

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/OWNER/clinicq-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/OWNER/clinicq-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

postgres:
  image: postgres:16-alpine
  database: clinicq
  username: clinicq
  password: clinicq-demo-password   # demo only; use a real secret store in production
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""               # empty = cluster default
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

ingress:
  enabled: true
  className: nginx
  host: ""                         # empty = match any host (use the LoadBalancer address)
  annotations: {}

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

# Needs the Prometheus Operator CRDs (install kube-prometheus-stack first)
serviceMonitor:
  enabled: false
  interval: 15s
